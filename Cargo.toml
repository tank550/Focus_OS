[workspace]
resolver = "2"
members = ["crates/focus-domain", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Focus OS"]
license = "MIT OR Apache-2.0"
rust-version = "1.90"
description = "Focus OS — local-first adaptive personal operating system"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }